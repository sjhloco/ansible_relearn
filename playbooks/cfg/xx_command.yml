- name: Use ios_command to run cmds on all vendors
  hosts: WAN1
  vars:
    show_cmds:
      - show ip arp
      - show ip interface brief
  tasks:
    - cisco.ios.ios_command: # noqa: name[missing] no-free-form
        commands: "{{ show_cmds }}"
      register: cli_output
    - name: Show output of first command
      ansible.builtin.debug:
        var: cli_output.stdout_lines[1] # Will be a list, for example [1] prints 2nd command
