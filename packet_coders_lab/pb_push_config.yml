- name: Arista Spine-Leaf Configuration
  hosts: arista_switches
  gather_facts: false
  tasks:
    # LOAD_VARS: Loads device-specific data into data var, only runs once even when the play targets multiple hosts.
    - name: Load variables from file
      ansible.builtin.include_vars:
        file: data.yml
        name: data
      run_once: true
    # CFG_NO_MOD: Uses generic CLI cmd as there is no separate module available for this feature
    - name: Enable IP routing
      arista.eos.eos_config:
        lines: ip routing
    # CFG_MOD_OSPF: Configure OSPF using specific module (equivalent to router ospf 1)
    - name: Enable OSPF
      arista.eos.eos_ospfv2:
        config:
          processes:
            - process_id: 1
    # CFG_MOD_INTF: Add Loopback0 using device name (inventory_hostname) to pull value from data var (data.yml)
    - name: Configure Loopback0 Interface
      arista.eos.eos_l3_interfaces:
        config:
          - name: Loopback0
            ipv4:
              - address: "{{ data[inventory_hostname]['loopback0'] }}"
    # CFG_MOD_INTF: Configure physical interfaces by looping dict from data, if description not defined skips setting that field entirely.
    - name: Configure All Physical Interfaces
      arista.eos.eos_interfaces:
        config:
          - name: "{{ item.name }}"
            description: "{{ item.description | default(omit) }}"
            enabled: true
            mode: layer3
            mtu: 9214
      loop: "{{ data[inventory_hostname].interfaces }}"
    # CFG_NO_MOD: Loops devices interfaces, as no dedicated module to configure ip address unnumbered uses generic arista.eos.eos_config module
    - name: Apply IP Unnumbered to all physical interfaces
      arista.eos.eos_config:
        lines:
          - ip address unnumbered Loopback0
        parents: "interface {{ item.name }}"
      loop: "{{ data[inventory_hostname].interfaces }}"
    # CFG_MOD_OSPF_INTF: Adds each physical interface to OSPF Area 0 and marks them as point-to-point by looping devices interface
    - name: OSPF Interface Configuration
      arista.eos.eos_ospf_interfaces:
        config:
          - name: "{{ item.name }}"
            address_family:
              - afi: "ipv4"
                area:
                  area_id: "0.0.0.0"
                network: "point-to-point"
      loop: "{{ data[inventory_hostname].interfaces }}"
    # CFG_MOD_OSPF_INTF:Advertise loopback into OSPF Area 0.
    - name: OSPF Loopback Configuration
      arista.eos.eos_ospf_interfaces:
        config:
          - name: Loopback0
            address_family:
              - afi: "ipv4"
                area:
                  area_id: "0.0.0.0"
