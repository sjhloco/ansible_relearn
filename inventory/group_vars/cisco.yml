---
## Temp will move later
ansible_user: admin
ansible_password: admin
## OS type, used by the transport method
ansible_network_os: cisco.ios.ios # also works ansible_network_os: ios
# ansible_network_os: ios
## Needed for transport of SSH
ansible_connection: ansible.netcommon.network_cli
