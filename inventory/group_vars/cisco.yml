# cfg/multi_vendor_resource_mod.yml
l3_cfg:
  - name: Ethernet0/1
    ipv4:
      - address: 10.10.10.2/30
  - name: Loopback1
    ipv4:
      - address: 2.2.2.2/32
bgp_cfg:
  as_number: "65002"
  bgp:
    router_id:
      address: 2.2.2.2
  neighbor:
    - neighbor_address: 10.10.10.1
      remote_as: "65001"
  networks:
    - address: 2.2.2.2
      netmask: 255.255.255.255

# cfg/apply_ntp_cfg_from_tmpl.yml
syslog_servers:
  - hostname: 10.10.10.50
  - hostname: 10.10.10.51

# show_parse/napalm.yml
napalm_provider:
  hostname: "{{ ansible_host }}"
  username: "{{ ansible_user }}"
  password: "{{ ansible_password }}"
  dev_os: "{{ ansible_network_os.split('.')[-1] }}"

# napalm_merge.yml
interfaces:
  - name: "Loopback0"
    description: "Loopback interface"
    ips:
      - "10.0.0.100 255.255.255.255"
    enabled: true # True or false used to enable or disable interfaces
  - name: "Ethernet1/1"
    description: "Link1"
    ips:
      - "192.168.1.100 255.255.255.0"
    enabled: true
